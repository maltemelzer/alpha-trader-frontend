# Access log without full IP addresses: IPv4 without the last byte, IPv6 only the first two groups;
# no referrer. Docker keeps at most 3 × 10 MB of logs (compose.yaml), older lines are overwritten.
map $remote_addr $remote_addr_anon {
  ~^(?P<ip4>\d+\.\d+\.\d+)\.        $ip4.0;
  ~^(?P<ip6>[0-9a-fA-F]*:[0-9a-fA-F]*):  $ip6::;
  default                              0.0.0.0;
}
log_format anon '$remote_addr_anon [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log anon;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build output never changes.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Fonts (public/fonts): file names change with the font, a month is safe.
  location /fonts/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Operator data, written at container start (docker/40-legal-config.sh). Never in search results.
  location = /legal.json {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }

  # Impressum/Datenschutz: the SPA page, but not indexed (name and address). Serves index.html directly –
  # an internal redirect to / would drop these headers. No robots.txt block: crawlers must read the noindex.
  location ~ ^/(impressum|datenschutz)/?$ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
  }

  # Feedback service (experiments). Docker's resolver + a variable: nginx starts even while the
  # feedback container is missing or restarting – the requests then answer 502, the page stays up.
  location /feedback-api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $feedback http://feedback:8787;
    proxy_pass $feedback;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
    proxy_read_timeout 20s;
  }

  # SPA: every route (/wertpapier/…, /nachrichten/…) falls back to index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
