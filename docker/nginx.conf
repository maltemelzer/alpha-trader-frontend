server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build output never changes.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Feedback service (experiments). Docker's resolver + a variable: nginx starts even while the
  # feedback container is missing or restarting – the requests then answer 502, the page stays up.
  location /feedback-api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $feedback http://feedback:8787;
    proxy_pass $feedback;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
    proxy_read_timeout 20s;
  }

  # SPA: every route (/wertpapier/…, /nachrichten/…) falls back to index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
