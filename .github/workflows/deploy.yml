name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  # Self-hosted runner on the Raspberry Pi (registered for this repo, see docker/README.md).
  deploy:
    needs: test
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      # Public partner ID, baked into the bundle (repo variable, see docker/README.md).
      PARTNER_ID: ${{ vars.PARTNER_ID }}
      PORT: ${{ vars.PORT || '9010' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          if [ -z "$PARTNER_ID" ]; then echo "::warning::Repo variable PARTNER_ID is not set – login will fail"; fi
          docker compose build --pull

      - name: Start container
        run: docker compose up -d --no-build --remove-orphans

      - name: Check it answers
        run: |
          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/wertpapier/STSN3G03LB"; then
              echo "Frontend is up on port ${PORT}"; exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail 50
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
