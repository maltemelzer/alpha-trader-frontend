name: Deploy

# Builds the production image on GitHub-hosted runners and pushes it to GHCR.
# The Pi pulls new images itself (docker/update.sh via cron) – no self-hosted runner,
# GitHub never runs code on the Pi. See docker/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Public partner ID, baked into the bundle (repo variable).
      PARTNER_ID: ${{ vars.PARTNER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Only the build stage runs commands, and it runs on the host platform (Dockerfile:
      # --platform=$BUILDPLATFORM); the arm64 stage just copies files – no QEMU needed.
      - name: Build and push (amd64 + arm64)
        run: |
          if [ -z "$PARTNER_ID" ]; then echo "::warning::Repo variable PARTNER_ID is not set – login will fail"; fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx create --use --name multi >/dev/null
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VITE_PARTNER_ID="$PARTNER_ID" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            --push .
          echo "Pushed $IMAGE:latest (sha-${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
