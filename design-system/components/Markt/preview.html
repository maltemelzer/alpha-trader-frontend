<!-- @dsCard group="Seiten" height=1000 width=1280 subtitle="Markt: Marktlage, Filter (Art, Suche, Kursspanne, Angebot/Nachfrage), Ergebnisliste, Live-Ticker" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Markt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .box { background: var(--bg-card); border-radius: var(--radius-md); }
  .wrap { padding: var(--space-6) var(--space-6) var(--space-8); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: var(--space-6); margin-top: var(--space-4); align-items: start; }
  .col { display: grid; gap: var(--space-4); min-width: 0; }
  .pad { padding: var(--space-4); }
  @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } .wrap { padding: var(--space-4); } }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var tickers = { HRD: { name: 'Hanse Reederei AG', change: 2.34, href: '#HRD' }, NBH: { name: 'Nordbank Holding', change: -0.62, href: '#NBH' }, ELW: { name: 'Elbwerk Energie', change: -2.87, href: '#ELW' }, SIG: { name: 'Signalwerk AG', change: 3.18, href: '#SIG' } };
  var now = Date.now();
  function r(asin, name, type, bid, ask, bs, as) { return { listing: { securityIdentifier: asin, name: name, type: type }, price: { bidPrice: bid, askPrice: ask, bidSize: bs, askSize: as } }; }
  var results = [r('STALSTERKS', 'Alsterkasse SE', 'STOCK', 55.74, 55.79, 8750037, 21), r('STHANSEREE', 'Hanse Reederei AG', 'STOCK', 48.70, 48.74, 8750, 21),
    r('BONORDK1QZ', 'Nordkap Bank AG 2,0500 %', 'BOND', 99.88, 100.0, 12000, 8000), r('ACALPHCOIN', 'AlphaCoins', 'COIN', 20001, 20240, 18618388, 751333),
    r('STELBWERKE', 'Elbwerk Energie SE', 'STOCK', 9.81, 9.90, 2400000, 900000), r('BUKONTOR01', 'Kontorhaus am Sandtor', 'BUILDING', null, 18400000, null, 1),
    r('ETATSXTRK1', 'ATSX Tracker', 'ETF', 125410.2, 125600, 40, 12)];
  var ticks = [
    { id: 't1', action: 'SELL', listing: { name: 'johnnytempleton42 Inc. 2,05 %', securityIdentifier: 'BOJ71XF384', type: 'BOND' }, price: 100.0, numberOfShares: 1000, date: now - 4000 },
    { id: 't2', action: 'SELL', listing: { name: 'Maxi199428 Inc.', securityIdentifier: 'STSS48VWFC', type: 'STOCK' }, price: 14.97, numberOfShares: 8, date: now - 9000 },
    { id: 't3', action: 'BUY', listing: { name: 'Hanse Reederei AG', securityIdentifier: 'STHANSEREE', type: 'STOCK' }, price: 48.74, numberOfShares: 500, date: now - 21000 },
    { id: 't4', action: 'SELL', listing: { name: 'zFloat Vault 007', securityIdentifier: 'STFLTVLT07', type: 'STOCK' }, price: 1.53, numberOfShares: 316, date: now - 44000 },
    { id: 't5', action: 'BUY', listing: { name: 'Alsterkasse SE', securityIdentifier: 'STALSTERKS', type: 'STOCK' }, price: 55.79, numberOfShares: 21, date: now - 61000 },
    { id: 't6', listing: { name: 'Nordbank Holding', securityIdentifier: 'STNORDBANK', type: 'STOCK' }, price: 17.35, numberOfShares: 250000, date: now - 90000 }];
  var stats = { onlineUsers: 161, users: 16829, companies: 9420, listings: 159196, marketCap: 3011052525588754 };
  function Page() {
    var f = React.useState({ type: '', search: '', withAsk: true });
    var shown = results.filter(function (x) { var v = f[0]; return (!v.type || x.listing.type === v.type) && (!v.search || (x.listing.name + x.listing.securityIdentifier).toLowerCase().indexOf(v.search.toLowerCase()) !== -1) && (!v.withAsk || x.price.askSize > 0) && (!v.withBid || x.price.bidSize > 0); });
    var t = React.useState(ticks);
    React.useEffect(function () { var i = 0, names = [['Signalwerk AG', 'STSIGNALWK', 132.4], ['Brauerei Stern', 'STBRAUSTRN', 7.94], ['Nordkap Bank AG', 'STNORDKAPB', 17.35]];
      var h1 = setInterval(function () { var n = names[i++ % 3]; t[1](function (old) { return [{ id: 'n' + i, action: i % 2 ? 'BUY' : 'SELL', listing: { name: n[0], securityIdentifier: n[1], type: 'STOCK' }, price: n[2], numberOfShares: 10 * i, date: Date.now() }].concat(old).slice(0, 10); }); }, 2500);
      return function () { clearInterval(h1); }; }, []);
    return h('div', { className: 'wrap' },
      h(DS.PageHeader, { title: 'Markt', eyebrow: 'Alle Wertpapiere', meta: h(DS.MarketPulse, { stats: stats }) }),
      h('div', { className: 'grid' },
        h('div', { className: 'col' },
          h(DS.Card, null, h(DS.MarketFilterBar, { value: f[0], onChange: function (v) { f[1](v); }, total: shown.length, onSave: function () {} })),
          h(DS.Card, { flush: true }, h(DS.MarketResults, { results: shown, hrefFor: function () { return '#'; } }))),
        h(DS.Card, { flush: true }, h(DS.LiveTicker, { title: 'Aktuelle Orders', items: t[0], hrefFor: function () { return '#'; } }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Page));
</script>
</body>
</html>
