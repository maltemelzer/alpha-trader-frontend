<!-- @dsCard group="Handy" height=330 width=390 subtitle="Kopfzeile für Unterseiten: Zurück, Titel mit Rubrik, bis zu zwei Icon-Aktionen" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>MobileTopBar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .box { background: var(--bg-card); border-radius: var(--radius-md); }
  body { background: var(--bg-page); }
  .gap { height: var(--space-4); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var tickers = { HRD: { name: 'Hanse Reederei AG', change: 2.34, href: '#HRD' }, NBH: { name: 'Nordbank Holding', change: -0.62, href: '#NBH' }, ELW: { name: 'Elbwerk Energie', change: -2.87, href: '#ELW' }, SIG: { name: 'Signalwerk AG', change: 3.18, href: '#SIG' } };
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    h('div', { className: 'lbl', style: { padding: '12px 16px 4px' } }, 'Wertpapier'),
    h(DS.MobileTopBar, { sticky: false, onBack: function () {}, eyebrow: 'STALSTERKS · Aktie', title: 'Alsterkasse SE', actions: [{ icon: 'merken', label: 'Merken', pressed: true }, { icon: 'glocke', label: 'Kursalarm' }] }),
    h('div', { className: 'gap' }),
    h('div', { className: 'lbl', style: { padding: '12px 16px 4px' } }, 'Mit Text beim Zurück'),
    h(DS.MobileTopBar, { sticky: false, onBack: function () {}, backText: 'Forum', title: 'Reedereien nach den Quartalszahlen – noch kaufen?', actions: [{ icon: 'merken', label: 'Beobachten' }] }),
    h('div', { className: 'gap' }),
    h('div', { className: 'lbl', style: { padding: '12px 16px 4px' } }, 'Ohne Zurück'),
    h(DS.MobileTopBar, { sticky: false, title: 'Benachrichtigungen', actions: [{ icon: 'haken', label: 'Alle gelesen' }] })));
</script>
</body>
</html>
