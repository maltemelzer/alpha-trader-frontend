<!-- @dsCard group="Formulare" height=330 width=980 subtitle="Eine Wahl mit Erklärung · waagerecht für kurze Optionen" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>RadioGroup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .box { background: var(--bg-card); border-radius: var(--radius-md); }
  .wrap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); padding: var(--space-4) var(--space-6); align-items: start; }
  .box { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var tickers = { HRD: { name: 'Hanse Reederei AG', change: 2.34, href: '#HRD' }, NBH: { name: 'Nordbank Holding', change: -0.62, href: '#NBH' }, ELW: { name: 'Elbwerk Energie', change: -2.87, href: '#ELW' }, SIG: { name: 'Signalwerk AG', change: 3.18, href: '#SIG' } };
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' },
    h('div', { className: 'box' }, h(DS.RadioGroup, { label: 'Art der Kapitalerhöhung', defaultValue: 'WITH_SUBSCRIPTION_RIGHTS', options: [
      { value: 'WITH_SUBSCRIPTION_RIGHTS', label: 'Mit Bezugsrecht', description: 'Bestehende Aktionäre zeichnen zuerst, im Verhältnis zu ihrem Bestand.' },
      { value: 'WITHOUT_SUBSCRIPTION_RIGHTS', label: 'Ohne Bezugsrecht', description: 'Neue Aktien gehen an alle Bieter zum festgelegten Preis.' }] })),
    h('div', { className: 'box' },
      h(DS.RadioGroup, { label: 'Enthaltungen zählen als', inline: true, defaultValue: 'NO', options: [{ value: 'NO', label: 'Nein' }, { value: 'YES', label: 'Ja' }] }),
      h(DS.RadioGroup, { label: 'Portfolio', inline: true, error: 'Bitte wählen Sie, aus welchem Portfolio gekauft wird.', options: [{ value: 'me', label: 'Privat' }, { value: 'c1', label: 'Hanse Beteiligungs AG' }] }))));
</script>
</body>
</html>
