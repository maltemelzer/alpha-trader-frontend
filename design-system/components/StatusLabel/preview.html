<!-- @dsCard group="Kurse" height=470 subtitle="Alle Order-Zustände · in der Order-Tabelle" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>StatusLabel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .wrap { padding: var(--space-4) var(--space-6); display: grid; gap: var(--space-4); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-6); padding-bottom: var(--space-4); border-bottom: var(--hairline) solid var(--line); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var S = DS.StatusLabel;
  var orders = [
    { id: 1, stock: { name: 'Hanse Reederei AG', ticker: 'HRD', meta: 'Kauf · Limit 48,50 €' }, qty: 50, status: 'open' },
    { id: 2, stock: { name: 'Nordbank Holding', ticker: 'NBH', meta: 'Verkauf · Market' }, qty: 40, status: 'filled' },
    { id: 3, stock: { name: 'Rheinstahl Werke', ticker: 'RSW', meta: 'Kauf · Limit 22,80 €' }, qty: 300, status: 'partial' },
    { id: 4, stock: { name: 'Elbwerk Energie', ticker: 'ELW', meta: 'Kauf · Stop 60,00 €' }, qty: 25, status: 'cancelled' },
    { id: 5, stock: { name: 'Bayerische Brauunion', ticker: 'BBU', meta: 'Kauf · Market' }, qty: 900, status: 'rejected' }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' },
    h('div', null, h('div', { className: 'lbl' }, 'Zustände'), h('div', { className: 'row' },
      ['pending', 'open', 'partial', 'filled', 'cancelled', 'expired', 'rejected'].map(function (s) { return h(S, { key: s, status: s }); }))),
    h(DS.Card, { title: 'Meine Orders', flush: true },
      h(DS.DataTable, { rows: orders, rowKey: 'id', density: 'sm', columns: [
        { key: 'stock', label: 'Order', type: 'stock' },
        { key: 'qty', label: 'Stück', type: 'number' },
        { key: 'status', label: 'Status', align: 'right', render: function (r) { return h(S, { status: r.status }, r.status === 'partial' ? 'Teilweise · 120 / 300' : undefined); } }
      ] }))));
</script>
</body>
</html>
