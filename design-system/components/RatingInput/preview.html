<!-- @dsCard group="Formulare" height=260 width=980 subtitle="Bewertung mit 1–5 Sternen · Wort zur Stufe · groß im Dialog" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>RatingInput</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .wrap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); padding: var(--space-4) var(--space-6); align-items: start; }
  .box { background: var(--bg-card); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' },
    h('div', { className: 'box' },
      h(DS.RatingInput, { label: 'Wie gefällt dir diese Startseite?', size: 'lg', defaultValue: 4, hint: 'Du kannst deine Bewertung später ändern.' })),
    h('div', { className: 'box' },
      h(DS.RatingInput, { label: 'Noch nicht bewertet' }),
      h(DS.RatingInput, { label: 'Pflichtfeld', error: 'Bitte wähle 1 bis 5 Sterne.' }))));
</script>
</body>
</html>
