<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }

  .box { padding: var(--space-4); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var tickers = {};
  var hanse = { id: 'c1', name: 'Hanse Beteiligungs AG', securityIdentifier: 'STHANSEBET' };
  function col(el) { return h('div', { className: 'box' }, el); }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' },
    col(h(DS.CorporateActionForm, { company: hanse, lastPrice: 48.72, outstandingShares: 5e10, cash: 2521136126.58, onSubmit: function () {} })),
    col(h(DS.CorporateActionForm, { company: hanse, defaultAction: 'LIQUIDATION', heading: 'Maßnahme beantragen', onCancel: function () {}, onSubmit: function () {} })),
    col(h(DS.CompanyFoundingForm, { cash: 993113.48, submitVariant: 'secondary', onSubmit: function () {} }))));
</script>
</body>
