<!-- @dsCard group="Forum" height=620 width=1000 subtitle="Themen eines Bereichs mit Sortierung und Seiten" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ThreadList</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .box { background: var(--bg-card); border-radius: var(--radius-md); }
  .wrap { padding: var(--space-4) var(--space-6); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-bottom: var(--hairline) solid var(--line); }
  .foot { display: flex; justify-content: flex-end; padding: var(--space-2) var(--space-4); border-top: var(--hairline) solid var(--line); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var tickers = { HRD: { name: 'Hanse Reederei AG', change: 2.34, href: '#HRD' }, NBH: { name: 'Nordbank Holding', change: -0.62, href: '#NBH' }, ELW: { name: 'Elbwerk Energie', change: -2.87, href: '#ELW' }, SIG: { name: 'Signalwerk AG', change: 3.18, href: '#SIG' } };
  var threads = [
    { id: 1, pinned: true, locked: true, title: 'Forenregeln: Bitte vor dem ersten Beitrag lesen', author: { name: 'Moderation' }, time: '01.07.', replies: 0, views: 9812, last: { author: 'Moderation', time: '01.07.' } },
    { id: 2, pinned: true, title: 'Sammelthema: Quartalszahlen im Oktober', author: { name: 'Frieda Kontor' }, time: '12.09.', tickers: ['HRD', 'NBH', 'ELW'], replies: 186, views: 4410, unread: 8, last: { author: 'Hanseat_M', time: '17:48' } },
    { id: 3, title: 'Reedereien nach den Quartalszahlen – noch kaufen?', author: { name: 'Frieda Kontor' }, time: 'Heute, 09:12', tickers: ['HRD'], replies: 24, views: 612, unread: true, last: { author: 'Börsenfuchs_77', time: '17:42' } },
    { id: 4, title: 'Elbwerk nach der Gewinnwarnung: Einstieg oder Finger weg?', author: { name: 'Anleger Paul' }, time: 'Heute, 08:03', tickers: ['ELW'], replies: 41, views: 1022, last: { author: 'Sie', time: '16:15' } },
    { id: 5, title: 'Banken und der Zinsentscheid', author: { name: 'Börsenfuchs_77' }, time: 'Gestern', tickers: ['NBH'], replies: 9, views: 288, last: { author: 'Frieda Kontor', time: 'Gestern' } },
    { id: 6, title: 'Signalwerk: Übertreibung oder neuer Marktführer?', author: { name: 'Hanseat_M' }, time: '20.09.', tickers: ['SIG'], replies: 63, views: 2130, last: { author: 'Neuling_42', time: '21.09.' } },
    { id: 7, locked: true, title: 'Gerüchte um Übernahme der Mainbau AG', author: { name: 'Neuling_42' }, time: '18.09.', replies: 12, views: 540, last: { author: 'Moderation', time: '19.09.' } }
  ];
  function Demo() {
    var pg = React.useState(1);
    return h('div', { className: 'wrap' }, h('div', { className: 'box' },
      h('div', { className: 'bar' },
        h(DS.SegmentedControl, { 'aria-label': 'Sortieren', size: 'sm', fullWidth: false, options: [{ value: 'new', label: 'Neueste' }, { value: 'active', label: 'Aktivste' }, { value: 'help', label: 'Hilfreichste' }] }),
        h(DS.Button, { variant: 'primary', size: 'sm' }, 'Neues Thema')),
      h(DS.ThreadList, { threads: threads, tickers: tickers, onSelect: function (t, e) { e.preventDefault(); } }),
      h('div', { className: 'foot' }, h(DS.Pagination, { page: pg[0], pages: 12, onChange: pg[1], total: '642 Themen' }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
