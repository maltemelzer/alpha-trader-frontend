<!-- @dsCard group="Kurse" height=360 subtitle="Watchlist · Depot mit Positionswert" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>StockRow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); padding: var(--space-4); align-items: start; }
  .colhead { display: grid; grid-template-columns: minmax(0,1fr) auto 88px; column-gap: var(--space-4);
    padding: var(--space-2) var(--space-4); border-bottom: var(--hairline) solid var(--line);
    font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); }
  .colhead span:not(:first-child) { text-align: right; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement, noop = function (e) { e.preventDefault(); };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' },
      h(DS.Card, { title: 'Watchlist', flush: true },
        h('ul', { className: 'bnk-list' },
          h(DS.StockRow, { name: 'Hanse Reederei AG', ticker: 'HRD', price: 48.72, change: 2.34, href: '#', onClick: noop }),
          h(DS.StockRow, { name: 'Nordbank Holding', ticker: 'NBH', price: 116.85, change: -0.62, href: '#', onClick: noop }),
          h(DS.StockRow, { name: 'Rheinstahl Werke', ticker: 'RSW', price: 23.1, change: 0, href: '#', onClick: noop }),
          h(DS.StockRow, { name: 'Bayerische Brauunion', ticker: 'BBU', price: 7.94, change: 5.12, href: '#', onClick: noop }))),
      h(DS.Card, { title: 'Ihr Depot', flush: true },
        h('div', { className: 'colhead' }, h('span', null, 'Titel'), h('span', null, 'Wert'), h('span', null, 'Heute')),
        h('ul', { className: 'bnk-list' },
          h(DS.StockRow, { name: 'Hanse Reederei AG', ticker: 'HRD', meta: '120 Stk.', value: 5846.4, price: 48.72, change: 2.34 }),
          h(DS.StockRow, { name: 'Nordbank Holding', ticker: 'NBH', meta: '40 Stk.', value: 4674, price: 116.85, change: -0.62 }),
          h(DS.StockRow, { name: 'Rheinstahl Werke', ticker: 'RSW', meta: '300 Stk.', value: 6930, price: 23.1, change: 0.41 })))
    ));
</script>
</body>
</html>
