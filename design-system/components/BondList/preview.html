<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>BondList</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .box { background: var(--bg-card); border-radius: var(--radius-md); }
  .wrap { padding: var(--space-4) var(--space-6); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var tickers = { HRD: { name: 'Hanse Reederei AG', change: 2.34, href: '#HRD' }, NBH: { name: 'Nordbank Holding', change: -0.62, href: '#NBH' }, ELW: { name: 'Elbwerk Energie', change: -2.87, href: '#ELW' }, SIG: { name: 'Signalwerk AG', change: 3.18, href: '#SIG' } };
  var now = Date.now(), H = 3600e3, D = 24 * H, href = function () { return '#'; };
  function bond(id, issuer, asin, rate, due, bid, ask, vol, face) {
    return { id: id, name: issuer + ' ' + rate.toFixed(4) + '%', issuer: { name: issuer, securityIdentifier: 'ST' + asin.slice(2) }, listing: { name: issuer, securityIdentifier: asin, type: 'BOND', startDate: now - D },
      interestRate: rate, maturityDate: now + due, issueDate: now - D + due, faceValue: face || 1000, volume: vol, priceSpread: { bidPrice: bid, askPrice: ask, lastPrice: { value: bid || 100, date: now - 20 * 60e3 } } };
  }
  var bonds = [
    bond('b1', 'Hanse Beteiligungs AG', 'BOHANSE27X', 2.25, 38 * 60e3, 99.9120, 100.0450, 950000000),
    bond('b2', 'Nordkap Bank AG', 'BONORDK1QZ', 2.05, 3 * H + 12 * 60e3, 99.8800, 100.0000, 4200000000, 10000),
    bond('b3', 'Alsterkasse SE', 'BOALSTR8K2', 1.95, 9 * H, null, 100.1000, 120000000),
    bond('b4', 'billieackmann2 Inc.', 'BOBO9E5X85', 2.05, 22 * H, 99.9500, null, 1000000),
    bond('b5', 'Elbwerk Energie SE', 'BOELBW4410', 3.10, 2 * D + 5 * H, 99.2100, 99.6400, 58000000)
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' }, h('div', { className: 'box' }, h(DS.BondList, { bonds: bonds, hrefFor: href }))));
</script>
</body>
</html>
