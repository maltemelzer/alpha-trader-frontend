<!-- @dsCard group="Chat" height=700 width=1100 subtitle="Allianz-Chat mit Unterhaltungen links · live schreiben" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ChatWindow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .wrap { padding: var(--space-4) var(--space-6); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var tickers = { STHANSEREE: { name: 'Hanse Reederei AG', change: 2.34, href: '#' }, STNORDKAPB: { name: 'Nordkap Bank', change: -0.62, href: '#' }, STELBWERKE: { name: 'Elbwerk Energie SE', change: -2.87, href: '#' } };
  var frieda = { name: 'Frieda Kontor', badge: h(DS.RankBadge, { rank: 1, size: 'sm' }) };
  var fuchs = { name: 'Börsenfuchs_77', badge: h(DS.RankBadge, { rank: 2, size: 'sm' }) };
  var paul = { name: 'Anleger Paul' };
  var liga = [
    { day: 'Gestern' },
    { system: 'Anleger Paul ist der Hanseatischen Allianz beigetreten.' },
    { author: paul, text: 'Moin zusammen! Wer hält hier noch $STELBWERKE?', time: '18:02' },
    { day: 'Heute' },
    { author: frieda, text: 'Ich hab heute früh $STHANSEREE nachgekauft.', time: '09:14' },
    { author: frieda, trade: { side: 'buy', status: 'ausgeführt', name: 'Hanse Reederei AG', ticker: 'STHANSEREE', qty: 120, price: 47.6, change: 2.35 }, time: '09:14' },
    { author: fuchs, text: 'Mutig. Ich warte auf die Quartalszahlen.', time: '09:31' },
    { own: true, text: 'Ich bin auch drin – Limit war bei 48,50 €.', time: '17:40' },
    { own: true, text: '$STNORDKAPB schwächelt übrigens seit Tagen.', time: '17:41', status: 'Gelesen' }
  ];
  var groups = [
    { label: 'Direkt', items: [
      { id: 'f', name: 'Frieda Kontor', preview: 'Hast du die Zahlen gesehen?', time: '17:12', unread: 2, online: true },
      { id: 'b', name: 'Börsenfuchs_77', preview: 'Du: Danke für den Tipp!', time: 'Mo.' }
    ] },
    { label: 'Gruppen', items: [
      { id: 'l', kind: 'group', name: 'Hanseatische Allianz', initials: 'HA', preview: 'Du: $STNORDKAPB schwächelt …', time: '17:41', active: true },
      { id: 'fr', kind: 'group', name: 'Freunde', initials: '#', preview: 'Paul: Wer ist Montag dabei?', time: 'So.', unread: 5 }
    ] },
    { label: 'Öffentlich', items: [
      { id: 'm', kind: 'public', name: 'Lobby (de)', preview: 'abimbola has joined', time: '06:12' },
      { id: 'e', kind: 'public', name: 'Lobby (en)', preview: 'howdy', time: 'Mo.' }
    ] }
  ];
  function Demo() {
    var msgs = React.useState(liga);
    return h('div', { className: 'wrap' }, h(DS.ChatWindow, {
      height: 640, title: 'Hanseatische Allianz', subtitle: '12 Mitglieder · 4 online',
      actions: [h(DS.Button, { key: 'm', variant: 'ghost', size: 'sm' }, 'Mitglieder')],
      list: h(DS.ConversationList, { groups: groups, onSelect: function () {} }),
      composer: h(DS.ChatComposer, { actions: h(DS.Button, { variant: 'ghost', size: 'sm' }, 'Trade teilen'),
        onSend: function (t) { msgs[1](msgs[0].concat([{ own: true, text: t, time: 'jetzt', status: 'Gesendet' }])); } })
    }, h(DS.ChatThread, { messages: msgs[0], tickers: tickers, typing: 'Frieda schreibt …' })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
