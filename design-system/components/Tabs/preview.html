<!-- @dsCard group="Navigation" height=420 subtitle="Seiten-Reiter · kleine Reiter in einer Karte" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Tabs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .wrap { padding: var(--space-4) var(--space-6); display: grid; gap: var(--space-6); }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-3); }
  .head h1 { margin: 0; font-family: var(--font-serif); font-size: 28px; line-height: 34px; font-weight: 600; }
  .price { display: flex; align-items: center; gap: var(--space-3); }
  .big { font-family: var(--font-mono); font-size: 28px; line-height: 32px; font-weight: 500; }
  .text { color: var(--text-secondary); font-size: 15px; line-height: 22px; max-width: 640px; margin: 0; }
  .narrow { max-width: 460px; }
  .intab .bnk-tabs__list { padding: 0 var(--space-2); }
  .intab .bnk-tabs__panel { padding-top: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' },
    h('div', null,
      h('div', { className: 'head' },
        h('h1', null, 'Hanse Reederei AG'),
        h('div', { className: 'price' }, h('span', { className: 'big' }, '48,72 €'), h(DS.PriceChange, { value: 2.34, variant: 'tag', size: 'lg', suffix: 'heute' }))),
      h(DS.Tabs, { 'aria-label': 'Aktie', defaultValue: 'overview', items: [
        { value: 'overview', label: 'Übersicht', content: h('p', { className: 'text' }, 'Reederei mit Sitz in Hamburg, 42 Containerschiffe, Dividende 1,80 € je Aktie. Die Reiter wechseln nur die Ansicht – Pfeiltasten links/rechts springen zwischen ihnen.') },
        { value: 'chart', label: 'Chart', content: h('p', { className: 'text' }, 'Hier steht der Kursverlauf (siehe Diagramme mit Plotly).') },
        { value: 'kpi', label: 'Kennzahlen', content: h('p', { className: 'text' }, 'KGV, Dividendenrendite, Börsenwert …') },
        { value: 'news', label: 'Nachrichten', count: 4, content: h('p', { className: 'text' }, '4 neue Meldungen.') },
        { value: 'orders', label: 'Meine Orders', disabled: true, content: null }
      ] })),
    h('div', { className: 'narrow' },
      h(DS.Card, { title: 'Top & Flop', flush: true },
        h(DS.Tabs, { size: 'sm', 'aria-label': 'Top und Flop', className: 'intab', items: [
          { value: 'top', label: 'Gewinner', content: h('ul', { className: 'bnk-list' },
              h(DS.StockRow, { name: 'Bayerische Brauunion', ticker: 'BBU', price: 7.94, change: 5.12 }),
              h(DS.StockRow, { name: 'Hanse Reederei AG', ticker: 'HRD', price: 48.72, change: 2.34 })) },
          { value: 'flop', label: 'Verlierer', content: h('ul', { className: 'bnk-list' },
              h(DS.StockRow, { name: 'Elbwerk Energie', ticker: 'ELW', price: 61.3, change: -2.87 }),
              h(DS.StockRow, { name: 'Nordbank Holding', ticker: 'NBH', price: 116.85, change: -0.62 })) }
        ] })))
  ));
</script>
</body>
</html>
