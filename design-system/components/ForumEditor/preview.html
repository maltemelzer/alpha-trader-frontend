<!-- @dsCard group="Forum" height=600 width=900 subtitle="Neues Thema: Titel, Bereich, Formatierung, Vorschau" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ForumEditor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .box { background: var(--bg-card); border-radius: var(--radius-md); }
  .wrap { padding: var(--space-4) var(--space-6); max-width: 820px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var tickers = { HRD: { name: 'Hanse Reederei AG', change: 2.34, href: '#HRD' }, NBH: { name: 'Nordbank Holding', change: -0.62, href: '#NBH' }, ELW: { name: 'Elbwerk Energie', change: -2.87, href: '#ELW' }, SIG: { name: 'Signalwerk AG', change: 3.18, href: '#SIG' } };
  var cats = [{ value: 'allg', label: 'Allgemeines' }, { value: 'aktien', label: 'Aktien im Gespräch' }, { value: 'strat', label: 'Strategien' }, { value: 'vv', label: 'Verbesserungsvorschläge' }, { value: 'hilfe', label: 'Hilfe für Einsteiger' }];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' },
    h(DS.ForumEditor, { mode: 'thread', heading: 'Neues Thema', categories: cats, defaultCategory: 'strat', tickers: tickers,
      defaultTitle: 'Nur noch Anleihen halten, solange der Leitzins steigt?',
      defaultValue: 'Ich überlege, bis zum 30. September nur noch **Dividendenwerte** zu halten, z. B. $HRD und $NBH.\n\n> Wer ruhig schläft, verkauft nicht im Tief.\n\nWas spricht dagegen?',
      onCancel: function () {}, onSubmit: function () {} })));
</script>
</body>
</html>
