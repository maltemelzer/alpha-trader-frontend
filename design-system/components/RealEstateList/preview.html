<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>RealEstateList</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .box { background: var(--bg-card); border-radius: var(--radius-md); }
  .wrap { padding: var(--space-4) var(--space-6); }
  .pad { padding: var(--space-2) var(--space-4); }
  @media (max-width: 480px) { .wrap { padding: var(--space-3); } }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var tickers = { HRD: { name: 'Hanse Reederei AG', change: 2.34, href: '#HRD' }, NBH: { name: 'Nordbank Holding', change: -0.62, href: '#NBH' }, ELW: { name: 'Elbwerk Energie', change: -2.87, href: '#ELW' }, SIG: { name: 'Signalwerk AG', change: 3.18, href: '#SIG' } };
  function o(name, asin, px, n) { return { listing: { name: name, securityIdentifier: asin, type: 'BUILDING' }, price: { askPrice: px, askSize: n } }; }
  var offers = [o('Kontorhaus am Sandtor', 'BUKONTOR01', 18400000, 1), o('Speicher Wandrahm 7', 'BUSPEICH07', 4250000, 2), o('Bürohaus Ballindamm', 'BUBALLIN12', 92000000000, 1), o('Lagerhalle Hafenkante', 'BULAGERH03', 1260000, 4)];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' }, h(DS.Card, { title: 'Immobilien', eyebrow: '4 im Angebot', flush: true },
    h('div', { className: 'pad' }, h(DS.RealEstateList, { offers: offers, hrefFor: function () { return '#'; }, onBuy: function () {} })))));
</script>
</body>
</html>
