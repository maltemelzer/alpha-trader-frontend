<!-- @dsCard group="Spiel" height=250 subtitle="Restzeit inline und als Kachel: Zeichnungsfrist, Order-Gültigkeit, Miner" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Countdown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .box { background: var(--bg-card); border-radius: var(--radius-md); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); padding: var(--space-4) var(--space-6); }
  .stack { display: flex; flex-direction: column; gap: var(--space-3); align-items: flex-start; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var tickers = {};
  var now = Date.now();
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' },
    h('div', null, h('div', { className: 'lbl' }, 'Inline'), h('div', { className: 'stack' },
      h(DS.Countdown, { label: 'Zeichnungsfrist', to: now + (2 * 86400 + 4 * 3600 + 12 * 60 + 33) * 1000 }),
      h(DS.Countdown, { label: 'Order gültig', to: now + (2 * 3600 + 5 * 60) * 1000, short: true }),
      h(DS.Countdown, { label: 'Nächste Limit-Änderung', to: now + 42 * 60 * 1000, short: true }))),
    h('div', null, h('div', { className: 'lbl' }, 'Kachel'), h('div', { className: 'box', style: { padding: '16px' } },
      h(DS.Countdown, { variant: 'tile', label: 'Kapitalerhöhung endet', to: now + (2 * 86400 + 4 * 3600 + 12 * 60 + 33) * 1000, hint: 'So., 27. September, 14:00 Uhr' })))));
</script>
</body>
</html>
