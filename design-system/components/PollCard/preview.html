<html lang="de">
<head>

<style>

  .box { background: var(--bg-card); border-radius: var(--radius-md); }

</head>
<body>
<div id="root"></div>
<script>

  var hanse = { id: 'c1', name: 'Hanse Beteiligungs AG', securityIdentifier: 'STHANSEBET', ceo: me };

      group: [{ groupMember: me, numberOfVoices: 12500000 }], votes: [{ type: 'YES', voices: 1582380000000, voter: { username: 'Frieda Kontor' } }, { type: 'NO', voices: 368300000000, voter: { username: 'Nordkap Bank' } }] },

</html>
