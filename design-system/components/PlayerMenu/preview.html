<!-- @dsCard group="Navigation" height=380 subtitle="Ausklapper in der Kopfleiste · inline im mobilen Menü" -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>PlayerMenu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Libre+Franklin:wght@400;600&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .wrap { display: grid; grid-template-columns: 1fr 300px; gap: var(--space-8); padding: var(--space-4) var(--space-6); align-items: start; }
  .bar { display: flex; justify-content: flex-end; align-items: center; height: 56px; border-bottom: var(--hairline) solid var(--line-strong); padding-right: var(--space-2); }
  .lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .mob { background: var(--bg-card); border: var(--border) solid var(--line-strong); border-radius: var(--radius-md); padding: var(--space-2) var(--space-4); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var DS = window.Bankiersgruen, h = React.createElement;
  var items = [
    { label: 'Profil', href: '#profil' },
    { label: 'Erfolge', href: '#erfolge', badge: 3 },
    { label: 'Einstellungen', href: '#einst' },
    { label: 'Hilfe', href: '#hilfe' },
    { divider: true },
    { label: 'Abmelden', href: '#logout' }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' },
    h('div', null, h('div', { className: 'lbl' }, 'In der Kopfleiste · geöffnet'),
      h('div', { className: 'bar' }, h(DS.PlayerMenu, { name: 'CptnIglo', subtitle: 'Hanseatische Allianz · Gold', items: items, defaultOpen: true }))),
    h('div', null, h('div', { className: 'lbl' }, 'Inline · mobiles Menü'),
      h('div', { className: 'mob' }, h(DS.PlayerMenu, { variant: 'inline', name: 'CptnIglo', subtitle: 'Hanseatische Allianz · Gold', items: items })))
  ));
</script>
</body>
</html>
