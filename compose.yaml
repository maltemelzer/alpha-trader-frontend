# Production containers. On the Pi: `docker compose pull && docker compose up -d`
# (docker/update.sh, via cron) uses the images built by GitHub Actions.
# Locally: `docker compose up -d --build` builds them from source; PARTNER_ID comes from .env
# for interpolation only, .env itself stays out of the image.
name: alpha-trader-frontend

services:
  frontend:
    image: ghcr.io/maltemelzer/alpha-trader-frontend:latest
    build:
      context: .
      args:
        VITE_PARTNER_ID: ${VITE_PARTNER_ID:-${PARTNER_ID:-}}
        VITE_API_BASE: ${VITE_API_BASE:-https://stable.alpha-trader.com}
    ports:
      - "${PORT:-9010}:80"
    # Operator for /impressum and /datenschutz – only in the .env on the Pi, never in the repo or image.
    environment:
      LEGAL_NAME: ${LEGAL_NAME:-}
      LEGAL_STREET: ${LEGAL_STREET:-}
      LEGAL_CITY: ${LEGAL_CITY:-}
      LEGAL_COUNTRY: ${LEGAL_COUNTRY:-Deutschland}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_PHONE: ${LEGAL_PHONE:-}
      LEGAL_HOSTING: ${LEGAL_HOSTING:-}
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped

  # Experiments: ratings and comments of players (feedback/README.md). Reached only through nginx
  # (/feedback-api/), no port of its own. FEEDBACK_ADMINS = game usernames that may read the evaluation.
  feedback:
    image: ghcr.io/maltemelzer/alpha-trader-feedback:latest
    build:
      context: feedback
    environment:
      FEEDBACK_ADMINS: ${FEEDBACK_ADMINS:-}
      API_BASE: ${VITE_API_BASE:-https://stable.alpha-trader.com}
    volumes:
      - feedback-data:/data
    logging: *logging
    restart: unless-stopped

volumes:
  feedback-data:
