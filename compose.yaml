# Compose reads PARTNER_ID from .env for interpolation only; .env itself stays out of the image.
name: alpha-trader-frontend

services:
  frontend:
    build:
      context: .
      args:
        VITE_PARTNER_ID: ${VITE_PARTNER_ID:-${PARTNER_ID:-}}
        VITE_API_BASE: ${VITE_API_BASE:-https://stable.alpha-trader.com}
    image: alpha-trader-frontend
    ports:
      - "${PORT:-9010}:80"
    restart: unless-stopped
